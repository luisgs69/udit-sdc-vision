# Hiperparámetros — YOLO11s finetuning BASE (sin augmentación)
# Experimento 1/2: finetuning limpio para medir capacidad del modelo sin data augmentation.
# Ver hyp_yolo11s_960_aug.yaml para el experimento con augmentation en clases minoritarias.

# ── Dataset ──────────────────────────────────────────────────────────────────
imgsz: 960
batch: 16         # FP16 960px: ~7-8 GB en A2
workers: 4

# ── Entrenamiento ─────────────────────────────────────────────────────────────
epochs: 100
patience: 10      # early stopping
amp: true         # FP16 — OK tras eliminar 6 bboxes degeneradas (w=0/h=0)
cos_lr: true

# ── Optimizador SGD ───────────────────────────────────────────────────────────
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ── Augmentación — DESACTIVADA ────────────────────────────────────────────────
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

# ── MLflow / salida ───────────────────────────────────────────────────────────
project: vision_proyect
name: yolo11s_960_base
