# Hiperparámetros — YOLO11s finetuning (960 px, GPU2, ≤10 GB)
# Referenciado desde train_yolo11s_960.py

# ── Dataset ──────────────────────────────────────────────────────────────────
imgsz: 960
batch: 8          # ~7 GB en A2 16 GB con 960 px; sube a 12 si sobra margen
workers: 4

# ── Entrenamiento ─────────────────────────────────────────────────────────────
epochs: 100
patience: 20      # early stopping: para si no mejora 20 epochs seguidas
amp: true         # mixed precision (FP16), obligatorio para caber en 10 GB
cos_lr: true      # cosine LR scheduler

# ── Optimizador SGD ───────────────────────────────────────────────────────────
optimizer: SGD
lr0: 0.01         # LR inicial
lrf: 0.01         # LR final = lr0 * lrf (llega a 0.0001 al terminar)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ── Augmentación ─────────────────────────────────────────────────────────────
# Escena de conducción: sin rotaciones extremas ni flip vertical
hsv_h: 0.015      # variación de tono
hsv_s: 0.7        # variación de saturación
hsv_v: 0.4        # variación de brillo
degrees: 0.0      # sin rotación (vehículos no aparecen inclinados)
translate: 0.1
scale: 0.5        # zoom ±50 %
shear: 0.0
perspective: 0.0
flipud: 0.0       # sin flip vertical (no hay coches boca abajo)
fliplr: 0.5       # flip horizontal OK en conducción
mosaic: 1.0       # mosaic 4-imágenes: muy útil para clases poco frecuentes
mixup: 0.0        # desactivado: confunde con objetos superpuestos
copy_paste: 0.0

# ── MLflow / salida ───────────────────────────────────────────────────────────
project: vision_proyect
name: finetuning_yolo11s_960
